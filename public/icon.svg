<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#047857" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>
  
  <!-- Logo Letter "ك" in Modern Calligraphy -->
  <g filter="url(#shadow)" fill="#ffffff">
    <path d="M 370 140 C 370 140 370 280 370 310 C 370 350 340 370 290 370 C 220 370 150 370 140 370 C 130 370 120 360 120 350 C 120 340 130 330 140 330 C 150 330 220 330 285 330 C 315 330 330 320 330 295 L 330 160 C 330 145 342 140 355 140 C 365 140 370 140 370 140 Z"/>
    <!-- Diacritic Mark (Hamza / Kaf crown) -->
    <path d="M 270 230 C 270 205 250 195 230 195 C 205 195 190 210 190 225 C 190 240 205 250 220 255 L 245 262 C 255 265 260 272 260 280 C 260 295 242 305 220 305 C 200 305 185 295 180 290 C 175 285 168 285 162 290 C 156 295 156 303 162 310 C 172 320 192 332 222 332 C 255 332 285 315 285 280 C 285 260 270 248 252 242 L 230 235 C 220 232 215 225 215 220 C 215 212 222 208 230 208 C 242 208 250 215 252 220 C 255 228 262 232 270 230 Z"/>
  </g>
  
  <!-- Mini ERP Badge -->
  <rect x="180" y="405" width="152" height="36" rx="18" fill="rgba(0,0,0,0.25)"/>
  <text x="256" y="429" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="3">KAF PRO</text>
</svg>
